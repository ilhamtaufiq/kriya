<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>Halaman tidak ditemukan — Kriya Studio</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0c0e;
        --text: #ede9e3;
        --muted: #9c9689;
        --accent: #0ae3b0;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 0 1.5rem;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .code {
        font-family: ui-monospace, monospace;
        color: var(--accent);
        letter-spacing: 0.2em;
        font-size: 0.85rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 28rem;
        line-height: 1.6;
      }
      a {
        margin-top: 0.5rem;
        color: var(--bg);
        background: var(--accent);
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <span class="code">ERROR 404</span>
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang Anda tuju tidak tersedia. Silakan kembali ke beranda Kriya Studio.</p>
    <a href="/">Kembali ke beranda</a>
  </body>
</html>
